name: Fork image

# Builds ghcr.io/<owner>/abs-fork-react: the fork server with this React client, the same
# image the owner runs (Dockerfile here, server repo as the abs-server build context).
# A v*-neo.* tag builds against the server fork's tag of the same name (tag both repos);
# a manual run takes the server branch or tag as input.

on:
  push:
    tags:
      - 'v*-neo.*'
  workflow_dispatch:
    inputs:
      server_ref:
        description: Server fork branch or tag
        default: neo

permissions:
  contents: read
  packages: write

env:
  SERVER_REPO: ${{ github.repository_owner }}/audiobookshelf
  SERVER_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.server_ref }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    # Each platform builds natively on its own runner, no QEMU
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: client-react

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SERVER_REPO }}
          ref: ${{ env.SERVER_REF }}
          path: server

      - name: Image name
        run: echo "IMAGE=ghcr.io/${OWNER,,}/abs-fork-react" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: server
          file: client-react/Dockerfile
          build-contexts: |
            abs-client=client-react
            abs-server=server
          platforms: ${{ matrix.platform }}
          # The source label links the package to this repository
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Unofficial personal fork of Audiobookshelf, not supported by the Audiobookshelf project
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
          echo "PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${OWNER,,}/abs-fork-react" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      # Every tag carries "fork" so the image never passes for an official release
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=fork
            type=match,pattern=v(.*),group=1,prefix=fork-
            type=sha,prefix=fork-sha-

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:fork"
